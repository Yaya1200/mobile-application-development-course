name: campus_companion
description: "Campus Companion — the running example app for Mobile Applications Development."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.1
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  # Files listed here are bundled into the app and read via the AssetBundle
  # (Image.asset, rootBundle.loadString, ...).
  assets:
    - assets/images/
